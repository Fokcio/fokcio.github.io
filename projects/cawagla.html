<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cawagla by Fokcio</title>
  <style>
    .background {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      filter: blur(5px);
      z-index: -1;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Cal Sans', sans-serif;
      background-color: black;
      flex-direction: column;
      margin: 0;
      padding: 0;
    }

    main {
      border: 3px solid rgb(119, 0, 255);
      padding: 20px;
      text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
      color: blueviolet;
      text-align: center;
      max-width: 700px;
      width: 90%;
      background-color: black;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .author,
    .version {
      font-size: 18px;
      margin: 5px 0;
    }

    .description {
      font-size: 20px;
      margin: 20px 0;
    }

    video.trailer {
      width: 100%;
      max-width: 600px;
      margin: 20px 0;
      border: 2px solid blueviolet;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(137, 43, 226, 0.5);
    }

    button {
      font-family: 'Cal Sans', sans-serif;
      padding: 10px 25px;
      font-size: 22px;
      background-color: blueviolet;
      color: black;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.3s;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
    }

    button:hover {
      transform: scale(1.1);
      background-color: #8c1bff;
    }

  </style>
</head>

<body>
  <main>
    <h1>Cawagla</h1>
    <p class="author">Creator: Fokcio</p>
    <p class="version">Version: 1.0.0</p>

    <p class="description">
      <!-- Tutaj możesz wkleić swój własny opis -->
      Cawagla to fałszywy wirus komputerowy napisany w pythonie, sprawia że użytkownik ma wrażenie, że zacią się mu komputer,
      Aby wyłączyć należy wpisać na klawiaturze "cawagla"
      Aplikacja została przetestowana na komputerze Windows 11
    </p>

    <button onclick="pobierzEXE()">📥 Pobierz .exe na windows</button>
    
    <div class="background"></div>
  </main>
  <script>
    function pobierzEXE() {
      const link = document.createElement('a');
      link.href = 'https://github.com/Fokcio/fokcio.github.io/releases/download/Cawagla/Cawagla.exe';
      link.download = 'Cawagla.exe';
      link.click();
    }
  </script>
</body>

</html>
